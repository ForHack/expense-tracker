services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: expense_tracker
    ports:
      # 5432 на хосте занят нативным PostgreSQL, поэтому пробрасываем на 5433
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d expense_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
  dbhub:
    image: bytebase/dbhub:latest
    ports:
      - "8080:8080"
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --dsn
      - "postgres://postgres:postgres@postgres:5432/expense_tracker?sslmode=disable"
    depends_on:
      - postgres

volumes:
  pgdata:
